  <script src="assets/js/app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var deliveryType = 'delivery';

    // Delivery toggle
    var deliveryBtn = document.getElementById('qf-delivery-btn');
    var pickupBtn = document.getElementById('qf-pickup-btn');
    var locRow = document.getElementById('qf-loc-row');
    [deliveryBtn, pickupBtn].forEach(function(btn) {
      btn.addEventListener('click', function() {
        deliveryType = btn.dataset.type;
        [deliveryBtn, pickupBtn].forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        if (locRow) locRow.style.display = deliveryType === 'pickup' ? 'none' : 'block';
      });
    });

    function renderQPItems() {
      var quote = window.CBH_getQuote ? CBH_getQuote() : [];
      var container = document.getElementById('qp-items');
      if (!container) return;
      if (quote.length === 0) {
        container.innerHTML = '<div style="padding:2rem 0;text-align:center;color:var(--text-muted)">' +
          '<p>Your quote list is empty.</p>' +
          '<a href="shop.html" class="btn-primary" style="display:inline-block;margin-top:1rem">Browse Products →</a>' +
          '</div>';
        return;
      }

      var totalEst = 0;
      var hasPrices = false;

      var itemsHtml = quote.map(function(item) {
        var priceLine = '';
        if (item.price) {
          hasPrices = true;
          var subtotal = item.price * item.qty;
          totalEst += subtotal;
          priceLine = '<span style="color:var(--gold);font-weight:700;font-size:0.85rem;">KSh ' + Number(item.price).toLocaleString() + ' each (Subtotal: KSh ' + Number(subtotal).toLocaleString() + ')</span>';
        } else {
          priceLine = '<span style="color:var(--gold);font-size:0.82rem;">Ask for price</span>';
        }

        var imgThumb = item.img
          ? '<img src="' + item.img + '" alt="' + item.name + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--border);" onerror="this.style.display=\'none\';">'
          : '';

        return '<li class="quote-item">' +
          '<div style="display:flex;align-items:center;gap:0.75rem;">' +
            imgThumb +
            '<div class="qi-info">' +
              '<span class="qi-name">' + item.name + '</span>' +
              '<span class="qi-unit">per ' + item.unit + '</span>' +
              priceLine +
            '</div>' +
          '</div>' +
          '<div class="qi-controls">' +
            '<button class="qty-btn" data-action="dec" data-id="' + item.id + '" aria-label="Decrease">\u2212</button>' +
            '<span class="qi-qty">' + item.qty + '</span>' +
            '<button class="qty-btn" data-action="inc" data-id="' + item.id + '" aria-label="Increase">+</button>' +
            '<button class="qty-btn remove-btn" data-action="remove" data-id="' + item.id + '" aria-label="Remove">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
            '</button>' +
          '</div>' +
          '</li>';
      }).join('');

      var totalHtml = hasPrices
        ? '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem;padding:1rem;background:var(--surface);border:1px solid var(--border-gold);border-radius:12px;">' +
            '<span style="font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text);">Estimated Total:</span>' +
            '<span style="font-size:1.3rem;font-weight:700;color:var(--gold);">KSh ' + Number(totalEst).toLocaleString() + '</span>' +
          '</div>'
        : '';

      container.innerHTML = '<ul class="quote-list" aria-label="Items in your quote">' + itemsHtml + '</ul>' + totalHtml;

      container.querySelector('.quote-list').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        if (btn.dataset.action === 'inc') CBH_updateQty(btn.dataset.id, 1);
        else if (btn.dataset.action === 'dec') CBH_updateQty(btn.dataset.id, -1);
        else if (btn.dataset.action === 'remove') { CBH_removeFromQuote(btn.dataset.id); }
        renderQPItems();
      });
    }

    renderQPItems();

    // Clear all
    document.getElementById('qp-clear-btn').addEventListener('click', function() {
      if (window.confirm('Clear your entire quote list?')) {
        CBH_clearQuote();
        renderQPItems();
      }
    });

    // Print
    document.getElementById('qp-print-btn').addEventListener('click', function() {
      window.print();
    });

    // Send on WhatsApp
    document.getElementById('quote-full-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('qf-name').value.trim();
      var phone = document.getElementById('qf-phone').value.trim();
      var location = document.getElementById('qf-location').value.trim();
      var notes = document.getElementById('qf-notes').value.trim();
      var pasted = document.getElementById('paste-list').value.trim();
      var errEl = document.getElementById('qf-error');

      if (!name) { errEl.textContent = 'Please enter your name.'; errEl.style.display='block'; document.getElementById('qf-name').focus(); return; }
      if (!phone) { errEl.textContent = 'Please enter your phone number.'; errEl.style.display='block'; document.getElementById('qf-phone').focus(); return; }
      var quote = CBH_getQuote();
      if (quote.length === 0 && !pasted) {
        errEl.textContent = 'Please add items to your quote list or paste your materials list.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      var msg = 'Hello Cool Base Hardware, I would like a quote.\n';
      msg += 'Name: ' + name + '\n';
      msg += 'Phone: ' + phone + '\n';
      if (deliveryType === 'pickup') {
        msg += 'Pickup from shop\n';
      } else {
        msg += 'Delivery to: ' + (location || 'Not specified') + '\n';
      }
      if (quote.length > 0) {
        msg += '\nItems:\n';
        var totalAmount = 0;
        var anyPrice = false;
        quote.forEach(function(item, i) {
          var line = (i+1) + '. ' + item.name + ' \u2013 ' + item.qty + ' ' + item.unit;
          if (item.price) {
            anyPrice = true;
            var sub = item.price * item.qty;
            totalAmount += sub;
            line += ' @ KSh ' + Number(item.price).toLocaleString() + ' = KSh ' + Number(sub).toLocaleString();
          }
          msg += line + '\n';
        });
        if (anyPrice) {
          msg += 'Estimated Total: KSh ' + Number(totalAmount).toLocaleString() + '\n';
        }
      }
      if (pasted) {
        msg += '\nPasted list:\n' + pasted + '\n';
      }
      if (notes) {
        msg += '\nNotes: ' + notes;
      }
      window.open('https://wa.me/254708292558?text=' + encodeURIComponent(msg), '_blank', 'noopener');
    });
  });
  </script>
